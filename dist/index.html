<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tu espacio local para trabajar con Claude Code y Codex, con memoria compartida."><title>Mixto · Tu equipo, un espacio</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<div id="app">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Mixto, inicio"><img src="/favicon.svg" width="34" height="34" alt=""><span>mixto<span class="brand-dot">.</span></span><span class="local-tag">LOCAL</span></a>
    <button class="new-button" id="new-conversation"><span>＋</span> Nueva conversación <kbd>N</kbd></button>
    <div class="section-label">PROYECTOS <button id="new-project" class="icon-button" aria-label="Crear proyecto">＋</button></div>
    <label class="sr-only" for="project-select">Proyecto</label><select id="project-select"></select>
    <div class="project-folder" id="project-folder"></div>
    <div class="section-label conversation-label">CONVERSACIONES</div><input id="conversation-search" class="conversation-search" placeholder="Buscar en conversaciones" aria-label="Buscar en conversaciones" autocomplete="off"><nav id="conversations" aria-label="Conversaciones"></nav>
    <div class="sidebar-bottom"><button id="open-team" class="nav-button"><span>👥</span> Equipo <span id="team-count" class="count">0</span></button><button id="open-memory" class="nav-button"><span>◇</span> Memoria <span id="memory-count" class="count">0</span></button><button id="open-connections" class="nav-button"><span>⌘</span> Agentes</button><div class="local-note"><span class="status-dot"></span> Guardado en este ordenador</div></div>
  </aside>
  <main>
    <header class="topbar"><div class="breadcrumb"><span id="project-name">Mi espacio</span><span class="slash">/</span><span id="conversation-title">Nueva conversación</span></div></header>
    <div class="workbench">
      <section class="conversation-panel">
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="run-status" class="run-status" hidden></div>
        <div class="composer-area">
          <form id="composer" class="composer"><label class="sr-only" for="prompt">Tu mensaje</label><textarea id="prompt" rows="3" placeholder="¿Qué vamos a hacer?" required></textarea><div id="attachments" class="attachments" hidden></div><div id="manual-panel" class="manual-panel" hidden></div><div class="composer-controls"><label class="provider-control"><span id="orchestrator-symbol">✳</span><select id="orchestrator" aria-label="Agente principal"><option value="codex">Codex</option><option value="claude">Claude Code</option></select></label><label class="mode-control"><select id="mode" aria-label="Modo de trabajo"><option value="orquestar">orquesta</option><option value="directo">directo</option><option value="manual">reparto a mano</option></select></label><label class="readonly-control"><input id="read-only" type="checkbox" checked> Solo consultar</label><button type="button" id="cancel-run" class="stop-button" hidden>■ Detener</button><button type="submit" id="send" class="send-button" aria-label="Enviar mensaje">↑</button></div></form>
          <div class="composer-hint"><span id="mode-hint">El orquestador reparte el trabajo entre los agentes necesarios.</span><span id="quota-hint" class="quota-hint" title="Cuota usada de Codex según su propia API. Se actualiza al terminar cada tarea y al pulsar Actualizar en Agentes."></span><span class="hint-actions"><button type="button" id="attach-button" class="hint-button" title="Adjuntar imágenes o archivos al mensaje">📎 Adjuntar</button><input type="file" id="attach-input" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,text/*,.md,.txt,.json,.pdf"><button type="button" id="opinion-button" class="hint-button" title="El otro agente revisa los cambios sin confirmar">Segunda opinión</button><button type="button" id="commit-button" class="hint-button" hidden title="Ver los cambios sin confirmar y crear un commit">Confirmar cambios</button><button type="button" id="terminal-toggle" class="hint-button" title="Ejecutar comandos en la carpeta del proyecto">Terminal</button><button type="button" id="notify-toggle" class="hint-button" title="Avisar con una notificación del sistema cuando una tarea termine o necesite algo">Avisos</button><span>Ctrl ↵ enviar</span></span></div>
          <div id="terminal-panel" class="terminal-panel" hidden></div>
        </div>
      </section>
    </div>
  </main>
</div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="Cerrar">×</button></div><div id="modal-content"></div></dialog>
<div id="toast" role="status" hidden></div>
<div id="connection-error" role="alert" hidden>No se puede conectar con Mixto. Comprueba que la app sigue abierta. <button id="reload">Reconectar</button></div>
</body></html>
